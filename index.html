<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Meu Inglês</title>
<meta name="theme-color" content="#4ECDC4" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- TELA DE BOAS-VINDAS (só aparece na primeira abertura) -->
  <section id="screen-onboarding" class="screen active">
    <div class="onboarding-body">
      <div id="onboarding-mascot" class="onboarding-mascot"></div>
      <h1 class="onboarding-title">Oi! Eu sou o Quokka!</h1>
      <p class="onboarding-sub">Vamos aprender inglês brincando?</p>
      <button id="btn-onboarding-start" class="big-btn">Vamos! →</button>
    </div>
  </section>

  <!-- TELA INICIAL -->
  <section id="screen-home" class="screen">
    <header class="home-header">
      <div id="home-mascot" class="home-mascot"></div>
      <div class="greeting">
        <div class="hello" id="home-greeting">Olá! 👋</div>
        <h1>Meu Inglês</h1>
      </div>
      <div class="streak-badge" id="streak-badge"></div>
      <button id="btn-settings" class="icon-btn" aria-label="Configurações">⚙️</button>
    </header>

    <button id="btn-session" class="mission-card">
      <div class="eyebrow">Sua Missão</div>
      <h2 id="mission-title">🎯 Vamos começar</h2>
      <div class="meta" id="mission-meta"></div>
      <span class="play-pill">▶ JOGAR</span>
    </button>

    <button id="btn-world-banner" class="world-banner">
      <div class="world-banner-head">
        <span class="ic">🏝️</span>
        <div class="txt">Quokka Bay<small>Explore lugares e pratique lá</small></div>
        <span>›</span>
      </div>
      <div class="world-banner-preview" id="world-banner-preview"></div>
    </button>

    <button id="btn-avatar-hero" class="avatar-hero-home">
      <div id="home-avatar-mount" class="voxel-avatar"></div>
      <span class="avatar-hero-hint" id="avatar-unlock-hint-home"></span>
    </button>
  </section>

  <!-- TELA MAPA -->
  <section id="screen-world" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-back="home">⬅️</button>
      <h2>🏝️ Quokka Bay</h2>
    </header>
    <div class="world-map" id="world-map">
      <div class="bay-sun"></div>
      <div class="bay-hill" style="width:140px;height:140px;top:50px;left:-40px;"></div>
      <div class="bay-hill" style="width:100px;height:100px;top:90px;right:-25px;"></div>
      <div class="bay-sand"></div>
      <div class="world-hint">👉 Toque num lugar pra ir e jogar lá!</div>
      <div id="world-pins"></div>
      <div class="world-avatar" id="world-avatar" style="top:55%;left:45%;"></div>
    </div>
    <div class="section-title">Explorar por categoria</div>
    <div id="category-grid" class="grid"></div>
  </section>

  <!-- TELA AVATAR -->
  <section id="screen-avatar" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-back="home">⬅️</button>
      <h2>Meu Avatar</h2>
    </header>
    <div class="avatar-hero">
      <div id="avatar-hero-mount" class="voxel-avatar"></div>
      <div class="unlocked-count" id="avatar-unlocked-count"></div>
    </div>
    <div class="unlock-hint" id="avatar-unlock-hint">&nbsp;</div>
    <div class="item-group">
      <div class="label">👕 Camiseta</div>
      <div class="item-row" id="row-shirt"></div>
    </div>
    <div class="item-group">
      <div class="label">🧢 Chapéu</div>
      <div class="item-row" id="row-hat"></div>
    </div>
    <div class="item-group">
      <div class="label">🎒 Mochila</div>
      <div class="item-row" id="row-backpack"></div>
    </div>
  </section>

  <!-- TELA CATEGORIA: explorar palavras -->
  <section id="screen-category" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-back="home">⬅️</button>
      <h2 id="category-title"></h2>
      <button id="btn-play-quiz" class="play-btn">🎮 Jogar</button>
    </header>
    <div id="word-grid" class="grid"></div>
  </section>

  <!-- TELA JOGO: quiz de escuta -->
  <section id="screen-quiz" class="screen">
    <header class="sub-header">
      <button class="back-btn" id="btn-quiz-back">⬅️</button>
      <div id="quiz-progress" class="quiz-progress"></div>
    </header>
    <div class="quiz-body">
      <button id="btn-repeat-word" class="repeat-btn">🔊 Ouvir de novo</button>
      <div id="quiz-options" class="quiz-options"></div>
    </div>
  </section>

  <!-- TELA DESBLOQUEIO -->
  <section id="screen-unlock" class="screen">
    <div class="unlock-body">
      <div class="unlock-lock" id="unlock-lock-icon">🔒</div>
      <div class="unlock-reveal" id="unlock-reveal">
        <div id="unlock-item-preview"></div>
        <h2>✨ Novo item! ✨</h2>
        <p id="unlock-item-name"></p>
      </div>
      <button id="btn-unlock-continue" class="big-btn">Continuar</button>
    </div>
  </section>

  <!-- TELA FIM DE JOGO -->
  <section id="screen-result" class="screen">
    <div class="result-body">
      <div id="result-stars" class="result-stars"></div>
      <p id="result-text"></p>
      <button id="btn-play-again" class="big-btn">🔁 Jogar de novo</button>
      <button class="big-btn secondary" id="btn-result-back">⬅️ Voltar</button>
    </div>
  </section>

  <!-- TELA CONFIGURAÇÕES (pais) -->
  <section id="screen-settings" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-back="home">⬅️</button>
      <h2>Configurações</h2>
    </header>
    <div class="settings-body">
      <div class="setting-row profile-row">
        <span>👤 Perfil</span>
        <div id="profile-switcher" class="profile-switcher"></div>
      </div>
      <hr />
      <label class="setting-row">
        <span>Velocidade da voz</span>
        <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.85" />
      </label>
      <label class="setting-row">
        <span>Voz em inglês</span>
        <select id="voice-select"></select>
      </label>
      <button id="btn-test-voice" class="big-btn">🔊 Testar voz</button>
      <hr />
      <button id="btn-check-update" class="big-btn secondary">🔄 Verificar atualização</button>
      <p class="update-status" id="update-status"></p>
      <hr />
      <p class="progress-summary" id="progress-summary"></p>
      <button id="btn-share-report" class="big-btn">📤 Compartilhar relatório</button>
      <button id="btn-reset-progress" class="big-btn danger">Zerar progresso</button>
      <hr />
      <p class="debug-title">🔧 Debug do motor adaptativo</p>
      <button id="btn-simulate-difficulty" class="big-btn secondary">🧪 Simular dificuldade (banheiro)</button>
      <div id="adaptation-log" class="adaptation-log"></div>
      <button id="btn-clear-log" class="big-btn danger">Limpar log</button>
    </div>
  </section>

</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
